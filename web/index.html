<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nnnoiseless — speech denoising in the browser</title>
  </head>
  <body>
    <header class="topbar">
      <h1>nnnoiseless</h1>
      <div class="info-popover">
        <button class="info-button" type="button" aria-label="Show engine details">i</button>
        <dl class="info-panel" aria-label="Engine details">
          <div><dt>Status</dt><dd id="badge-status">Loading…</dd></div>
          <div><dt>Version</dt><dd id="badge-version">—</dd></div>
          <div><dt>Kernels</dt><dd id="badge-isa">—</dd></div>
        </dl>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="settings-title">
        <h2 id="settings-title">Denoising settings</h2>
        <div class="controls">
          <label>
            <span class="label-row">
              <span>Backend</span>
              <span class="label-actions"><output id="hush-model-info">RNNoise</output></span>
            </span>
            <select id="ctl-backend">
              <option value="rnnoise">RNNoise — 48 kHz</option>
              <option value="hush">Hush — 16 kHz</option>
            </select>
          </label>

          <label class="filebutton">
            <input type="file" id="hush-model-input" accept=".tar.gz,application/gzip" aria-label="Load Hush model bundle" />
            <span>Load Hush model bundle</span>
          </label>

          <label>
            <span class="label-row">
              <span>Attenuation limit</span>
              <span class="label-actions">
                <output id="out-attenuation">off</output>
                <span class="field-help">
                  <button class="info-button" type="button" aria-label="Attenuation limit information">i</button>
                  <span class="tooltip" role="tooltip">Sets a maximum amount of noise suppression.</span>
                </span>
              </span>
            </span>
            <input type="range" id="ctl-attenuation" min="0" max="30" step="1" value="0" />
          </label>

          <label>
            <span class="label-row">
              <span>VAD gate threshold</span>
              <span class="label-actions">
                <output id="out-vad">off</output>
                <span class="field-help">
                  <button class="info-button" type="button" aria-label="VAD threshold information">i</button>
                  <span class="tooltip" role="tooltip">Reduces frames below the speech threshold.</span>
                </span>
              </span>
            </span>
            <input type="range" id="ctl-vad" min="0" max="0.95" step="0.05" value="0" />
          </label>

          <label>
            <span class="label-row">
              <span>Lookahead</span>
              <span class="label-actions">
                <output id="out-lookahead">0 frames</output>
                <span class="field-help">
                  <button class="info-button" type="button" aria-label="Lookahead information">i</button>
                  <span class="tooltip" role="tooltip">Adds offline latency to protect speech onsets.</span>
                </span>
              </span>
            </span>
            <input type="range" id="ctl-lookahead" min="0" max="6" step="1" value="0" />
          </label>
        </div>
      </section>

      <section class="panel" aria-labelledby="file-title">
        <h2 id="file-title">Audio file</h2>
        <div class="row">
          <button id="btn-demo" class="primary">Generate sample</button>
          <label class="filebutton">
            <input
              type="file"
              id="file-input"
              accept="audio/*"
              aria-label="Choose an audio file"
            />
            <span>Choose audio file</span>
          </label>
          <span id="clip-info" class="muted" role="status">No file selected</span>
        </div>

        <div class="waveforms" id="waveforms" hidden>
          <figure>
            <figcaption>
              <span>Original</span>
              <button class="ghost" id="play-before">Play</button>
            </figcaption>
            <canvas
              id="wave-before"
              height="110"
              role="img"
              aria-label="Original waveform"
            ></canvas>
          </figure>
          <figure>
            <figcaption>
              <span>Denoised</span>
              <button class="ghost" id="play-after">Play</button>
              <span id="process-time" class="muted"></span>
            </figcaption>
            <canvas
              id="wave-after"
              height="110"
              role="img"
              aria-label="Denoised waveform"
            ></canvas>
          </figure>
        </div>
      </section>

      <section class="panel" aria-labelledby="microphone-title">
        <h2 id="microphone-title">
          Live microphone
          <span class="heading-help">
            <button class="info-button" type="button" aria-label="Microphone information">i</button>
            <span class="tooltip" role="tooltip">Use headphones to avoid feedback.</span>
          </span>
        </h2>
        <div class="row">
          <button id="btn-mic" class="primary">Start microphone</button>
          <label class="checkbox">
            <input type="checkbox" id="ctl-bypass" />
            <span>Bypass denoising</span>
          </label>
        </div>
        <div class="meter-block">
          <span class="meter-label">Speech estimate</span>
          <div
            class="meter"
            role="meter"
            aria-label="Speech probability"
            aria-valuemin="0"
            aria-valuemax="1"
            aria-valuenow="0"
          >
            <div class="meter-fill" id="vad-meter"></div>
          </div>
          <output id="vad-value" aria-live="polite">0.00</output>
        </div>
        <p id="mic-error" class="error" role="alert" hidden></p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
