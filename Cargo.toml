[package]
name = "nnnoiseless"
version = "0.2.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Pure-Rust RNNoise-style real-time audio denoising"
readme = "README.md"
default-run = "nnnoiseless"

[features]
default = ["bin", "dasp"]
bin = [
    "dep:anyhow",
    "dep:clap",
    "dep:hound",
]
dasp = ["dep:dasp"]
mic-example = ["dep:cpal", "dep:hound"]
# Force the portable scalar kernels even when the CPU supports SIMD. Use this
# when bit-for-bit reproducibility across machines matters more than speed.
reference = []
# Keep the neural-network weights quantized as `i8` in memory and widen them
# during inference. Saves ~3x model memory at a cost in speed.
low-memory = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "nnnoiseless"
path = "src/nnnoiseless.rs"
required-features = ["bin"]

[[example]]
name = "mic_denoise"
path = "examples/mic_denoise.rs"
required-features = ["mic-example"]

[[bench]]
name = "denoise"
harness = false

[dependencies]
realfft = "3.5.0"
anyhow = { version = "1.0.55", optional = true }
clap = { version = "3.1.1", features = ["cargo"], optional = true }
cpal = { version = "0.18.1", optional = true }
dasp = { version = "0.11.0", features = ["signal"], optional = true }
hound = { version = "3.4.0", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
